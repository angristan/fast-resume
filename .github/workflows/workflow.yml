name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Existing release version to resume publishing (e.g. 2.8.0, without the v prefix)'
        required: true
        type: string

# Jobs that release or publish declare their own elevated permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -D @commitlint/cli @commitlint/config-conventional
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.toolchain.outputs.cachekey }}-
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked

  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - name: Build and test flake outputs
        run: nix flake check --no-update-lock-file --print-build-logs

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test launcher
        run: npm test --prefix npm/fast-resume
      - name: Check package metadata synchronization
        run: |
          node npm/scripts/set-version.mjs "$(node -p "require('./npm/fast-resume/package.json').version")"
          git diff --exit-code
      - name: Inspect package contents
        run: npm pack ./npm/fast-resume --dry-run

  python-wheel:
    name: Python wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    env:
      SCCACHE_GHA_CACHE_FROM: ${{ matrix.platform.target }}
      SCCACHE_GHA_CACHE_TO: ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Linux (x86_64)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - name: Linux (ARM64)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2014'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --compatibility pypi

      - name: Build macOS wheel
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi

      - name: Verify wheel installs and runs
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/pip install dist/*.whl
          .wheel-test/bin/fr --version
          .wheel-test/bin/fr --help
          .wheel-test/bin/fast-resume --version

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [commitlint, rust, nix, npm-package, python-wheel]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    # Prevent concurrent releases from racing (would cause "tag already exists" errors)
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new_release_version: ${{ steps.check.outputs.version || steps.resume.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # The semantic-release prepare step runs cargo update / cargo metadata.
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push'
      - name: Get latest tag before release
        if: github.event_name == 'push'
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm install -D semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec
      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Check if a new release was created
        if: github.event_name == 'push'
        id: check
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          if [ "$LATEST_TAG" != "${{ steps.before.outputs.tag }}" ] && [ -n "$LATEST_TAG" ]; then
            echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          fi
      # Manual dispatch resumes publishing for a tag that semantic-release
      # already created; downstream publish steps skip artifacts that exist.
      - name: Resume release from an existing tag
        if: github.event_name == 'workflow_dispatch'
        id: resume
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION does not exist" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build binary (${{ matrix.platform.name }})
    needs: [release]
    if: needs.release.outputs.new_release_version != ''
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            runner: macos-26
            archive: macos-arm64
          - name: macOS (Intel)
            runner: macos-26-intel
            archive: macos-x86_64
          - name: Linux (x86_64)
            runner: ubuntu-latest
            archive: linux-x86_64
          - name: Linux (ARM64)
            runner: ubuntu-24.04-arm
            archive: linux-arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - name: Cache Cargo dependencies and release build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.toolchain.outputs.cachekey }}-

      - name: Build binary
        run: cargo build --release --locked

      - name: Package binary
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          PLATFORM: ${{ matrix.platform.archive }}
        run: |
          mkdir -p dist/fr
          cp target/release/fr dist/fr/fr
          chmod +x dist/fr/fr
          ln -sf fr dist/fr/fast-resume
          tar -czf "dist/fast-resume-${VERSION}-${PLATFORM}.tar.gz" -C dist fr

      - name: Verify binary runs
        run: |
          ./dist/fr/fr --version
          ./dist/fr/fr --help

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.release.outputs.new_release_version }}" \
            dist/fast-resume-*.tar.gz \
            --clobber

  build-python-wheels:
    name: Build PyPI wheel (${{ matrix.platform.name }})
    needs: [release]
    if: needs.release.outputs.new_release_version != ''
    runs-on: ${{ matrix.platform.runner }}
    env:
      SCCACHE_GHA_CACHE_FROM: ${{ matrix.platform.target }}
      SCCACHE_GHA_CACHE_TO: ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            runner: macos-26
            target: aarch64-apple-darwin
            artifact: python-wheel-macos-arm64
            npm_package: fast-resume-darwin-arm64
          - name: macOS (Intel)
            runner: macos-26-intel
            target: x86_64-apple-darwin
            artifact: python-wheel-macos-x86_64
            npm_package: fast-resume-darwin-x64
          - name: Linux (x86_64)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
            artifact: python-wheel-linux-x86_64
            npm_package: fast-resume-linux-x64
          - name: Linux (ARM64)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2014'
            artifact: python-wheel-linux-arm64
            npm_package: fast-resume-linux-arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --compatibility pypi

      - name: Build macOS wheel
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi

      - name: Verify wheel installs and runs
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/pip install dist/*.whl
          .wheel-test/bin/fr --version
          .wheel-test/bin/fr --help
          .wheel-test/bin/fast-resume --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Extract npm binary
        run: >-
          python npm/scripts/extract_wheel_binary.py
          --wheel-dir dist
          --output npm-binary/${{ matrix.platform.npm_package }}

      - uses: actions/upload-artifact@v7
        with:
          name: npm-binary-${{ matrix.platform.npm_package }}
          path: npm-binary/${{ matrix.platform.npm_package }}/
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI wheels
    needs: [release, build-python-wheels]
    if: needs.release.outputs.new_release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Publish wheels
        run: uv publish --check-url https://pypi.org/simple/fast-resume/ dist/*.whl

  publish-npm:
    name: Publish npm package
    needs: [release, build-python-wheels]
    if: needs.release.outputs.new_release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-binary-*
          path: npm-binaries
      - name: Pack npm packages
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -eu
          mkdir -p npm-dist npm-stage
          for package_dir in npm/platforms/*; do
            package=$(basename "$package_dir")
            cp -R "$package_dir" "npm-stage/$package"
            cp -R "npm-binaries/npm-binary-$package/bin" "npm-stage/$package/bin"
            cp LICENSE "npm-stage/$package/LICENSE"
            chmod +x "npm-stage/$package/bin/fr"
            npm pack "./npm-stage/$package" --pack-destination npm-dist
          done
          cp LICENSE npm/fast-resume/LICENSE
          npm pack ./npm/fast-resume --pack-destination npm-dist
          rm npm/fast-resume/LICENSE
          test -f "npm-dist/fast-resume-$VERSION.tgz"
      - name: Verify packaged launcher
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          mkdir .npm-test
          npm install --prefix .npm-test --omit=optional \
            "./npm-dist/fast-resume-$VERSION.tgz"
          mkdir .npm-test/node_modules/fast-resume-linux-x64
          tar -xzf "./npm-dist/fast-resume-$VERSION-linux-x64.tgz" \
            -C .npm-test/node_modules/fast-resume-linux-x64 \
            --strip-components=1
          .npm-test/node_modules/.bin/fr --version
          .npm-test/node_modules/.bin/fast-resume --help
      - name: Publish native variants, then launcher
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -eu
          publish_if_missing() {
            package_version=$1
            tarball=$2
            tag=$3
            if npm view "fast-resume@$package_version" version >/dev/null 2>&1; then
              echo "fast-resume@$package_version is already published"
            else
              npm publish "./$tarball" --access public --provenance --tag "$tag"
            fi
          }

          for package_dir in npm/platforms/*; do
            package_alias=$(basename "$package_dir")
            variant=${package_alias#fast-resume-}
            publish_if_missing \
              "$VERSION-$variant" \
              "npm-dist/fast-resume-$VERSION-$variant.tgz" \
              native
          done
          publish_if_missing "$VERSION" "npm-dist/fast-resume-$VERSION.tgz" latest

  update-homebrew:
    name: Update Homebrew formula
    needs: [release, build-binaries]
    if: needs.release.outputs.new_release_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/angristan/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f "client_payload[formula]=fast-resume" \
            -f "client_payload[version]=${{ needs.release.outputs.new_release_version }}"
